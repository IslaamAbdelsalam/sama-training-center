name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SamaTraining.sln

      - name: Build
        run: dotnet build SamaTraining.sln --no-restore -c Release

      # Fails the build when a NuGet package with a known vulnerability is used.
      - name: Check packages for known vulnerabilities
        run: |
          dotnet list SamaTraining.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "(Critical|High|Moderate)" vuln.txt; then echo "::error::Vulnerable packages found"; exit 1; fi

      - name: Test
        run: dotnet test SamaTraining.sln --no-build -c Release --logger "console;verbosity=normal" --logger "GitHubActions;summary-include-passed=false"

      # Creates a database migration when the data model changed and no migration was written for it:
      # "InitialCreate" the first time, then "Schema<run number>". Committed back on main (next step).
      - name: Generate migration for model changes
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          if [ -z "$(ls src/SamaTraining.Web/Data/Migrations/*.cs 2>/dev/null)" ]; then
            dotnet ef migrations add InitialCreate --project src/SamaTraining.Web --output-dir Data/Migrations
          elif ! dotnet ef migrations has-pending-model-changes --project src/SamaTraining.Web; then
            dotnet ef migrations add "Schema${{ github.run_number }}" --project src/SamaTraining.Web --output-dir Data/Migrations
          else
            echo "Database migrations are up to date."
          fi
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=Design;Trusted_Connection=True;TrustServerCertificate=True"

      # On main, commit a newly generated migration back to the repository.
      - name: Commit generated migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain src/SamaTraining.Web/Data/Migrations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/SamaTraining.Web/Data/Migrations
            git commit -m "Add database migration for model changes (generated by CI)"
            git push
          fi

      - name: Upload generated migration
        if: hashFiles('src/SamaTraining.Web/Data/Migrations/*.cs') != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: src/SamaTraining.Web/Data/Migrations/

      - name: Publish (deployable package)
        run: dotnet publish src/SamaTraining.Web/SamaTraining.Web.csproj -c Release -o publish --no-restore

      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: sama-training-web
          path: publish/
